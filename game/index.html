<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadows of Pasar Senja — Stealth Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest { position: absolute; left: 8px; top: 8px; z-index: 5; color: #0f0; background: #000;
    font: 13px monospace; white-space: pre; margin: 0; display: none; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Shadows of Pasar Senja: a top-down stealth heist across a night market, a museum and a harbour"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="selftest"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
